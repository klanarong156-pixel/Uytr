<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Farm - Production</title>
<style>
body{font-family:system-ui,sans-serif;background:#0b1220;color:#fff;margin:0;padding:18px}h1{font-size:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#151f32;border:1px solid #26344d;border-radius:16px;padding:16px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0}.btn{border:0;border-radius:10px;padding:11px 15px;background:#2563eb;color:white;font-weight:700}.off{background:#334155}.status{font-weight:700}.on{color:#34d399}.danger{color:#fb7185}input[type=time]{background:#0b1220;color:#fff;border:1px solid #475569;border-radius:8px;padding:8px}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{background:#334155}.tabs button.active{background:#16a34a}.muted{color:#94a3b8;font-size:13px}select{background:#0b1220;color:#fff;padding:8px;border-radius:8px}
</style>
</head>
<body>
<h1>🌱 SMART FARM — PRODUCTION</h1>
<div class="card"><div class="row"><span>MQTT</span><span id="mqttStatus" class="status danger">DISCONNECTED</span></div><div class="row"><span>ESP8266</span><span id="espStatus" class="status danger">OFFLINE</span></div><div class="row"><span>Mode</span><span id="modeText">MANUAL</span></div></div>
<h2>ควบคุมอุปกรณ์</h2><div id="relayGrid" class="grid"></div>
<h2>ตั้งเวลา</h2><div class="card"><div class="tabs" id="scheduleTabs"></div><div class="row"><label>เปิดใช้งาน <input id="schedEnable" type="checkbox"></label></div><div class="row"><label>เวลาเปิด <input id="schedOn" type="time" value="00:00"></label><label>เวลาปิด <input id="schedOff" type="time" value="00:00"></label></div><div id="schedSummary" class="muted"></div><div class="row"><button class="btn" onclick="saveSchedule()">บันทึก</button><button class="btn off" onclick="deleteSchedule()">ลบ</button></div></div>
<h2>เซนเซอร์</h2><div class="grid"><div class="card">อุณหภูมิ <b id="temperature">--</b> °C</div><div class="card">ความชื้น <b id="humidity">--</b> %</div></div>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="config.js"></script><script src="mqtt-handler.js"></script>
<script>
const relays=[['pump','ปั๊มน้ำ'],['zone1','โซน 1'],['lighthome','ไฟบ้าน'],['lightsala','ไฟศาลา']];let currentSchedTab='pump';const schedules={};relays.forEach(x=>schedules[x[0]]={enabled:false,on:'00:00',off:'00:00'});
const $=id=>document.getElementById(id);
function build(){ $('relayGrid').innerHTML=relays.map(([id,name])=>`<div class="card"><h3>${name}</h3><div class="row"><span id="${id}Status" class="status danger">ปิด</span><button id="${id}Btn" class="btn off" onclick="toggleRelay('${id}')">เปิด / ปิด</button></div></div>`).join('');$('scheduleTabs').innerHTML=relays.map(([id,name])=>`<button class="btn ${id==='pump'?'active':''}" data-tab="${id}" onclick="switchSchedTab('${id}')">${name}</button>`).join('');}
function toggleRelay(id){if(APP_STATE.mode==='auto'){alert('อยู่ใน Auto Mode: อุปกรณ์จะทำงานตามตารางเวลา');return}mqttHandler.publish(MQTT_CONFIG.topics.relaySet(id),APP_STATE.relays[id]?'OFF':'ON');}
function updateRelay(id,on){APP_STATE.relays[id]=on;$(id+'Status').textContent=on?'เปิด':'ปิด';$(id+'Status').className='status '+(on?'on':'danger');$(id+'Btn').className='btn '+(on?'':'off');}
function switchSchedTab(id){currentSchedTab=id;document.querySelectorAll('#scheduleTabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));const s=schedules[id];$('schedEnable').checked=s.enabled;$('schedOn').value=s.on;$('schedOff').value=s.off;$('schedSummary').textContent=s.enabled?`${id}: ${s.on} - ${s.off}`:'ยังไม่เปิดใช้งาน';}
function saveSchedule(){const enabled=$('schedEnable').checked,on=$('schedOn').value,off=$('schedOff').value;if(on===off){alert('เวลาเปิดและปิดต้องไม่เท่ากัน');return} schedules[currentSchedTab]={enabled,on,off};mqttHandler.publish(MQTT_CONFIG.topics.scheduleSet(currentSchedTab),JSON.stringify(schedules[currentSchedTab]),{retain:true});switchSchedTab(currentSchedTab)}
function deleteSchedule(){schedules[currentSchedTab]={enabled:false,on:'00:00',off:'00:00'};mqttHandler.publish(MQTT_CONFIG.topics.scheduleSet(currentSchedTab),'DELETE');switchSchedTab(currentSchedTab)}
window.addEventListener('mqtt:connected',e=>{$('mqttStatus').textContent='CONNECTED';$('mqttStatus').className='status on'});window.addEventListener('esp:status',e=>{$('espStatus').textContent=e.detail?'ONLINE':'OFFLINE';$('espStatus').className='status '+(e.detail?'on':'danger')});window.addEventListener('relay:status',e=>{if(relays.some(x=>x[0]===e.detail.relay))updateRelay(e.detail.relay,e.detail.status)});window.addEventListener('mode:status',e=>{$('modeText').textContent=e.detail?'AUTO':'MANUAL';APP_STATE.mode=e.detail?'auto':'manual'});window.addEventListener('schedule:status',e=>{try{const d=JSON.parse(e.detail.payload);schedules[e.detail.relay]={enabled:!!d.enabled,on:d.on||'00:00',off:d.off||'00:00'};if(e.detail.relay===currentSchedTab)switchSchedTab(currentSchedTab)}catch(_){}});window.addEventListener('sensor:data',e=>{try{const d=JSON.parse(e.detail.value);if(d.temperature!=null)$('temperature').textContent=Number(d.temperature).toFixed(1);if(d.humidity!=null)$('humidity').textContent=Number(d.humidity).toFixed(1)}catch(_){}});
build();switchSchedTab('pump');mqttHandler.connect();
</script></body></html>
